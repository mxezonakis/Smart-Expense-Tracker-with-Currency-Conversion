name: Solution verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore and audit all dependencies
        run: dotnet restore SmartExpenseTracker.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -warnaserror

      - name: Build
        run: dotnet build SmartExpenseTracker.slnx --configuration Release --no-restore -warnaserror

      - name: Verify Docker engine for SQL Server tests
        run: docker info

      - name: Restore coverage reporting tool
        run: dotnet tool restore

      - name: Run NUnit tests with coverage (including SQL Server)
        run: dotnet test SmartExpenseTracker.slnx --configuration Release --no-build --no-restore --settings coverage.runsettings --collect "XPlat Code Coverage" --logger "console;verbosity=normal" --logger trx --results-directory TestResults/coverage

      - name: Consolidate production coverage
        if: ${{ !cancelled() }}
        run: dotnet reportgenerator "-reports:TestResults/coverage/**/coverage.cobertura.xml" "-targetdir:TestResults/coverage-report" "-reporttypes:Html;Cobertura;JsonSummary;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: ${{ !cancelled() }}
        run: cat TestResults/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tests and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-and-coverage
          path: TestResults/
          if-no-files-found: error

      - name: Verify formatting
        run: dotnet format SmartExpenseTracker.slnx --no-restore --verify-no-changes

      - name: Report vulnerable direct and transitive packages
        if: ${{ !cancelled() }}
        run: dotnet package list --project SmartExpenseTracker.slnx --no-restore --vulnerable --include-transitive

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start the Compose stack and verify SQL-backed API and Swagger
        run: |
          export MSSQL_SA_PASSWORD="Aa1!$(openssl rand -hex 24)"
          echo "::add-mask::$MSSQL_SA_PASSWORD"
          trap 'docker compose logs --no-color --tail 60 migrate api; docker compose down --volumes' EXIT
          docker compose up --build --detach
          docker compose ps --all
          url=http://127.0.0.1:54131
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "$url/api/categories" | jq -e '. == []'
          curl -fsS "$url/swagger/index.html" | grep -i 'swagger-ui'
          curl -fsS "$url/openapi/v1.json" | jq -e '.paths["/api/categories"].get != null'
