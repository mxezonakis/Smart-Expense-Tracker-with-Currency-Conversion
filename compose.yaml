x-connection: &connection
  ConnectionStrings__SmartExpenseTracker: 'Server=sqlserver;Database=SmartExpenseTracker;User ID=sa;Password="${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}";Encrypt=true;TrustServerCertificate=true'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    build:
      context: .
      target: migrate
    environment: *connection
    depends_on:
      sqlserver:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      <<: *connection
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:54131:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  sql-data:
